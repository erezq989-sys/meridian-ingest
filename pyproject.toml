[project]
name = "meridian-ingest"
version = "0.1.0"
description = "Meridian Bikes S3 data pipeline with bronze/silver/gold layers"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.31",
    "python-dateutil>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.9",
    "black>=24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: integration tests",
    "slow: tests that download published S3 archives",
]

[tool.mypy]
files = ["src"]
strict = true
