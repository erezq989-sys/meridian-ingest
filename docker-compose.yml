name: meridian-ingest

x-airflow-common: &airflow-common
  image: meridian-ingest-airflow:3.0.2
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-environment
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/meridian/dags
    AIRFLOW__CORE__PLUGINS_FOLDER: /opt/meridian/plugins
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__SECRET_KEY: meridian-local-api-secret-key
    AIRFLOW__API_AUTH__JWT_SECRET: meridian-local-jwt-secret-key-at-least-32-bytes
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
    AIRFLOW_API_URL: http://airflow-api-server:8080
    COMPOSE_PROJECT_NAME: meridian-ingest
    MERIDIAN_PROJECT_DIR: /opt/meridian
    PGHOST: postgres
    PGPORT: 5432
    PGUSER: meridian
    PGPASSWORD: meridian
    PGDATABASE: trips
    PYTHONPATH: /opt/meridian/src
  volumes:
    - .:/opt/meridian
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  user: "50000:0"
  depends_on: &airflow-dependencies
    airflow-db:
      condition: service_healthy
    schema:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: trips
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d trips"]
      interval: 5s
      timeout: 5s
      retries: 20

  schema:
    build: .
    environment: &database-environment
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: meridian
      PGPASSWORD: meridian
      PGDATABASE: trips
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    command: python -c "from meridian.db import init_schema; init_schema()"
    restart: "no"

  app:
    build: .
    environment: *database-environment
    depends_on:
      schema:
        condition: service_completed_successfully
    volumes:
      - .:/app
    working_dir: /app
    command: tail -f /dev/null
    restart: unless-stopped

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && python -m meridian_ops.cli init"
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      <<: *airflow-dependencies
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-dependencies
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-dependencies
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_db_data:
  airflow_logs:

